<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img"
     aria-label="Map plate template — no map has been baked yet">
  <title>Map plate template</title>
  <!--
    Drop-in target for a baked map plate. This is NOT a map of anywhere: it is
    the frame the Locations department exports into after the tech scout, so the
    bundled-image path (no tiles, no requests, pinch-zoom) is proven before the
    real plate exists. Export at this size, keep the registration marks, then
    point the plate's `src` at the new file in /admin.
  -->
  <rect width="1600" height="1100" fill="#f4f2ed"/>
  <g stroke="#c3bfb4" stroke-width="1">
    <!-- 100px reference grid -->
    <path d="M100 0V1100M200 0V1100M300 0V1100M400 0V1100M500 0V1100M600 0V1100M700 0V1100M800 0V1100M900 0V1100M1000 0V1100M1100 0V1100M1200 0V1100M1300 0V1100M1400 0V1100M1500 0V1100"/>
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600M0 900H1600M0 1000H1600"/>
  </g>
  <rect x="20" y="20" width="1560" height="1060" fill="none" stroke="#0d0d0d" stroke-width="6"/>
  <g fill="#0d0d0d">
    <!-- registration marks -->
    <path d="M20 120h60v6H20zM20 20h6v60h-6zM1520 120h60v6h-60zM1574 20h6v60h-6zM20 974h60v6H20zM20 1020h6v60h-6zM1520 974h60v6h-60zM1574 1020h6v60h-6z"/>
    <!-- north arrow -->
    <path d="M1420 180 L1450 100 L1480 180 L1450 158 Z"/>
    <text x="1450" y="212" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="700"
          text-anchor="middle" letter-spacing="4">N</text>
    <!-- scale bar, unlabelled until the plate is baked -->
    <rect x="120" y="960" width="200" height="14"/>
    <rect x="320" y="960" width="200" height="14" fill="none" stroke="#0d0d0d" stroke-width="3"/>
    <text x="120" y="1010" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="700"
          letter-spacing="3" fill="#a97b1e">SCALE — SET ON EXPORT</text>
    <text x="120" y="520" font-family="-apple-system, system-ui, sans-serif" font-size="64" font-weight="800"
          letter-spacing="6">PLATE TEMPLATE</text>
    <text x="120" y="580" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="600"
          fill="#5e5e5e">No plate has been baked. Export the scout plate into this frame,</text>
    <text x="120" y="622" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="600"
          fill="#5e5e5e">bundle it under /maps, and point the plate at it in /admin.</text>
  </g>
</svg>
